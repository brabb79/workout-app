<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111418">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root { --bg:#111418; --card:#1b2026; --line:#2c333c; --text:#e8ecf1; --muted:#8e99a6; --accent:#4cc38a; --danger:#e5484d; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) 16px 96px; max-width:560px; margin:0 auto; }
h1 { font-size:18px; margin:16px 0 8px; display:flex; justify-content:space-between; align-items:center; }
h1 small { color:var(--muted); font-weight:normal; font-size:13px; }
h2 { font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:20px 0 8px; }
.row { display:flex; gap:8px; align-items:center; }
.row > * { flex:1; }
button { font:inherit; border:0; border-radius:10px; padding:14px; background:var(--card); color:var(--text); cursor:pointer; min-height:48px; }
button.primary { background:var(--accent); color:#06281a; font-weight:600; }
button.ghost { background:transparent; color:var(--muted); min-height:36px; padding:6px 10px; }
button.danger { color:var(--danger); }
input, select { font:inherit; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); min-height:48px; }
input[type=number] { text-align:center; }
label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
.card { background:var(--card); border-radius:14px; padding:14px; margin:10px 0; }
.types { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.types button { font-weight:600; min-height:60px; }
.set { display:grid; grid-template-columns:40px 1fr 1fr 40px; gap:8px; align-items:center; margin:6px 0; }
.set .n { color:var(--muted); text-align:center; }
.entry { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.entry:last-child { border-bottom:0; }
.entry .tap { flex:1; cursor:pointer; }
.entry .what { font-weight:600; }
.entry .detail { color:var(--muted); font-size:14px; }
.hint { color:var(--muted); font-size:13px; margin-top:4px; }
.hidden { display:none !important; }
.actions { display:flex; gap:8px; margin-top:12px; }
.day { color:var(--muted); font-size:13px; margin:14px 0 4px; }
#menu { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; justify-content:center; }
#menu button { min-height:40px; padding:8px 12px; font-size:14px; background:var(--bg); }
.toast { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--accent); color:#06281a; padding:8px 14px; border-radius:8px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<h1>Workout Log <small id="dateLabel"></small></h1>
<div class="row">
  <input type="date" id="date">
  <select id="units" aria-label="Units"><option value="kg">kg / km</option><option value="lb">lb / mi</option></select>
</div>
<label class="row" style="margin-top:8px"><input type="checkbox" id="awake" style="width:auto;min-height:0;flex:0"> <span>Keep screen on while this is open</span></label>

<h2>Log</h2>
<div class="types">
  <button data-type="lift">Lift</button>
  <button data-type="cardio">Cardio</button>
  <button data-type="body">Weight</button>
</div>

<form id="liftForm" class="card hidden" autocomplete="off">
  <label for="liftName">Exercise</label>
  <input id="liftName" list="liftList" placeholder="Squat" required>
  <datalist id="liftList"></datalist>
  <div class="hint" id="liftLast"></div>
  <div id="sets"></div>
  <button type="button" class="ghost" id="addSet">+ set</button>
  <label for="liftNote">Note</label>
  <input id="liftNote" placeholder="optional">
  <div class="actions"><button type="button" class="ghost cancel">Cancel</button><button type="submit" class="primary">Save</button></div>
</form>

<form id="cardioForm" class="card hidden" autocomplete="off">
  <label for="cardioName">Activity</label>
  <input id="cardioName" list="cardioList" placeholder="Run" required>
  <datalist id="cardioList"></datalist>
  <div class="hint" id="cardioLast"></div>
  <div class="row">
    <div><label for="cardioMin">Minutes</label><input id="cardioMin" type="number" inputmode="decimal" min="0" step="any" required></div>
    <div><label for="cardioDist">Distance <span class="distUnit">km</span></label><input id="cardioDist" type="number" inputmode="decimal" min="0" step="any"></div>
  </div>
  <label for="cardioNote">Note</label>
  <input id="cardioNote" placeholder="optional">
  <div class="actions"><button type="button" class="ghost cancel">Cancel</button><button type="submit" class="primary">Save</button></div>
</form>

<form id="bodyForm" class="card hidden" autocomplete="off">
  <label for="bodyWeight">Bodyweight <span class="wUnit">kg</span></label>
  <input id="bodyWeight" type="number" inputmode="decimal" min="0" step="any" required>
  <div class="hint" id="bodyLast"></div>
  <div class="actions"><button type="button" class="ghost cancel">Cancel</button><button type="submit" class="primary">Save</button></div>
</form>

<h2>Today</h2>
<div class="card" id="today"><div class="hint">Nothing logged yet.</div></div>

<h2>History</h2>
<div id="history"></div>

<div id="menu">
  <button id="exportCsv">Export CSV</button>
  <button id="backup">Backup</button>
  <button id="restore">Restore</button>
  <input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
